<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Ledger — Supabase Feature Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#f3eee1;--card:#fffdf8;--ink:#2a2620;--soft:#6b6455;--line:#d8cfb8;--rust:#7a2e1e;--moss:#2e4324}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}#auth{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 18px 50px rgba(42,38,32,.08)}.mark{width:56px;height:56px;display:grid;place-items:center;background:var(--ink);color:var(--paper);border-radius:9px;font:bold 22px monospace;margin-bottom:16px}.title{font:600 22px monospace;margin:0}.sub,.hint,.msg,.foot{color:var(--soft);font-size:12px;line-height:1.5}.tabs{display:flex;border-bottom:1px solid var(--line);margin:20px 0 16px}.tabs button,.link{background:none;border:0;padding:8px 12px;color:var(--soft);cursor:pointer}.tabs .active{color:var(--ink);border-bottom:2px solid var(--ink)}label{display:block;font-size:11px;text-transform:uppercase;font-weight:600;color:var(--soft);margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid var(--line);background:white;border-radius:3px;font-size:14px}button.primary{width:100%;margin-top:16px;padding:11px;background:var(--ink);color:var(--paper);border:0;border-radius:3px;font-weight:600;cursor:pointer}.link{display:block;margin:10px auto;text-decoration:underline}.msg{min-height:18px;margin-top:12px}.error{color:var(--rust)}.ok{color:var(--moss)}#app{display:none;height:100vh;position:relative}.bar{height:44px;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:6px 12px;background:var(--ink);color:var(--paper);font-size:11px}.bar button{border:1px solid #777;background:transparent;color:var(--paper);padding:5px 9px;border-radius:3px;cursor:pointer}.bar .sync{margin-right:auto;font-family:monospace}iframe{width:100%;height:calc(100vh - 44px);border:0;background:var(--paper)}.foot{border-top:1px solid var(--line);margin-top:18px;padding-top:12px;font-size:10px}
</style>
</head>
<body>
<section id="auth"><div class="card"><div class="mark">JL</div><h1 class="title">Job search ledger</h1><p class="sub">Feature-branch test — applications sync through Supabase.</p><div id="root"></div><p class="foot">The existing Job Ledger UI is loaded unchanged inside the feature test. Supabase Auth supplies the session and Row Level Security protects database rows.</p></div></section>
<section id="app"><div class="bar"><span class="sync" id="sync">Not signed in</span><span id="email"></span><button id="syncBtn">Sync</button><button id="logout">Sign out</button></div><iframe id="ledger" src="./index.html" title="Job Ledger"></iframe></section>
<script>
const SUPABASE_URL='https://YOUR-PROJECT.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY';
const KEY='job-search-ledger-applications';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
let currentUser=null,lastSnapshot='',busy=false;
const $=id=>document.getElementById(id);
function validPin(p){return /^\d{6}$/.test(p)}
function msg(t,error=false){$('msg').textContent=t;$('msg').className='msg '+(error?'error':'ok')}
function form(mode='login'){
 let h='';
 if(mode==='login')h='<div class="tabs"><button class="active" onclick="form(\'login\')">Sign in</button><button onclick="form(\'signup\')">Create account</button></div><label>Email</label><input id="emailIn" type="email" autocomplete="email"><label>6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"><button class="primary" onclick="auth(\'login\')">Sign in</button><button class="link" onclick="form(\'forgot\')">Forgot PIN?</button>';
 if(mode==='signup')h='<div class="tabs"><button onclick="form(\'login\')">Sign in</button><button class="active" onclick="form(\'signup\')">Create account</button></div><label>Email</label><input id="emailIn" type="email" autocomplete="email"><label>Create 6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><label>Confirm PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><button class="primary" onclick="auth(\'signup\')">Create account</button>';
 if(mode==='forgot')h='<div class="tabs"><button onclick="form(\'login\')">Sign in</button><button class="active">Reset PIN</button></div><p class="hint">Enter your email. Supabase will send a secure reset link.</p><label>Email</label><input id="emailIn" type="email" autocomplete="email"><button class="primary" onclick="auth(\'forgot\')">Send reset email</button><button class="link" onclick="form(\'login\')">Back to sign in</button>';
 if(mode==='recovery')h='<p class="hint">Choose a new 6-digit PIN.</p><label>New 6-digit PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><label>Confirm PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"><button class="primary" onclick="auth(\'recovery\')">Update PIN</button>';
 $('root').innerHTML=h+'<div id="msg" class="msg"></div>';
 document.querySelectorAll('input').forEach(i=>i.addEventListener('input',()=>{if(i.id.startsWith('pin'))i.value=i.value.replace(/\D/g,'').slice(0,6)}));
}
async function auth(mode){if(busy)return;busy=true;try{
 if(mode==='login'){let email=$('emailIn').value.trim().toLowerCase(),pin=$('pin').value;if(!email||!validPin(pin))return msg('Enter a valid email and 6-digit PIN.',true);let r=await sb.auth.signInWithPassword({email,password:pin});if(r.error)return msg(r.error.message,true)}
 if(mode==='signup'){let email=$('emailIn').value.trim().toLowerCase(),p=$('pin').value,p2=$('pin2').value;if(!email||!validPin(p)||p!==p2)return msg('Enter a valid email and matching 6-digit PINs.',true);let r=await sb.auth.signUp({email,password:p});if(r.error)return msg(r.error.message,true);if(!r.data.session)return msg('Account created. Check your email to confirm it, then sign in.')}
 if(mode==='forgot'){let email=$('emailIn').value.trim().toLowerCase();if(!email)return msg('Enter your email.',true);let r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error)return msg(r.error.message,true);return msg('Reset email sent. Check your inbox.')}
 if(mode==='recovery'){let p=$('pin').value,p2=$('pin2').value;if(!validPin(p)||p!==p2)return msg('Enter matching 6-digit PINs.',true);let r=await sb.auth.updateUser({password:p});if(r.error)return msg(r.error.message,true);await sb.auth.signOut();form('login');msg('PIN updated. Sign in with your new PIN.')}
 }finally{busy=false}}
function fromDb(x){return {id:x.id,company:x.company,role:x.role,dateApplied:x.date_applied,status:x.status,statusUpdatedAt:x.status_updated_at,link:x.link||'',resumeVersion:x.resume_version||'',coverLetterNotes:x.cover_letter_notes||'',notes:x.notes||'',archived:!!x.archived,logs:Array.isArray(x.logs)?x.logs:[]}}
function toDb(a){return {id:a.id,user_id:currentUser.id,company:a.company,role:a.role,date_applied:a.dateApplied,status:a.status,status_updated_at:a.statusUpdatedAt||a.dateApplied,link:a.link||null,resume_version:a.resumeVersion||null,cover_letter_notes:a.coverLetterNotes||null,notes:a.notes||null,archived:!!a.archived,logs:a.logs||[]}}
async function dbLoad(){let r=await sb.from('job_applications').select('*').order('date_applied',{ascending:false});if(r.error)throw r.error;return (r.data||[]).map(fromDb)}
async function syncRemoteToFrame(){let data=await dbLoad();localStorage.setItem(KEY,JSON.stringify(data));lastSnapshot=JSON.stringify(data);$('sync').textContent='Synced';$('ledger').contentWindow.location.reload()}
async function syncFrameToRemote(){if(!currentUser||busy)return;let raw=localStorage.getItem(KEY);if(raw===null)return;let data;try{data=JSON.parse(raw)}catch{return}let snap=JSON.stringify(data);if(snap===lastSnapshot)return;busy=true;try{let r=await sb.from('job_applications').upsert(data.map(toDb),{onConflict:'id'});if(r.error)throw r.error;let ids=new Set(data.map(a=>a.id));let remote=await dbLoad();for(const a of remote)if(!ids.has(a.id)){let d=await sb.from('job_applications').delete().eq('id',a.id);if(d.error)throw d.error}lastSnapshot=snap;$('sync').textContent='Synced '+new Date().toLocaleTimeString()}catch(e){$('sync').textContent='Sync error';console.error(e)}finally{busy=false}}
async function migrateIfNeeded(){let local=[];try{local=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let remote=await dbLoad();if(!remote.length&&local.length&&confirm(`Found ${local.length} application(s) in this browser. Import them into your Supabase account?`)){let r=await sb.from('job_applications').upsert(local.map(toDb),{onConflict:'id'});if(r.error)throw r.error;remote=await dbLoad()}localStorage.setItem(KEY,JSON.stringify(remote));lastSnapshot=JSON.stringify(remote)}
async function openApp(session){currentUser=session.user;$('email').textContent=currentUser.email;$('auth').style.display='none';$('app').style.display='block';try{await migrateIfNeeded();$('ledger').contentWindow.location.reload();$('sync').textContent='Synced'}catch(e){$('sync').textContent='Database error';alert(e.message)}}
async function logout(){await sb.auth.signOut();currentUser=null;lastSnapshot='';localStorage.removeItem(KEY);$('app').style.display='none';$('auth').style.display='grid';form('login')}
$('logout').onclick=logout;$('syncBtn').onclick=syncFrameToRemote;$('ledger').addEventListener('load',()=>{if(currentUser)syncFrameToRemote()});setInterval(()=>{if(currentUser)syncFrameToRemote()},5000);
(async()=>{form('login');let r=await sb.auth.getSession();if(location.hash.includes('type=recovery')){form('recovery');return}if(r.data.session)openApp(r.data.session);sb.auth.onAuthStateChange((e,s)=>{if(e==='PASSWORD_RECOVERY'){form('recovery');$('app').style.display='none';$('auth').style.display='grid'}else if(s)openApp(s);else logout()})})();
</script>
</body></html>
