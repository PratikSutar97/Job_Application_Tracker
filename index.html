<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Search Ledger</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#2A2620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job Ledger">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --paper:#F3EEE1;
    --card:#FFFDF8;
    --ink:#2A2620;
    --ink-soft:#6B6455;
    --line:#D8CFB8;
    --line-strong:#C2B694;
    --rust:#B3452F;
    --rust-ink:#7A2E1E;
    --rust-bg:#F1DAD3;
    --slate:#3C5470;
    --slate-ink:#22374D;
    --slate-bg:#DCE6EE;
    --moss:#4C6B3C;
    --moss-ink:#2E4324;
    --moss-bg:#E1EAD9;
    --amber-ink:#7A5A0E;
    --amber-bg:#F3E4BE;
    --gray:#8A8378;
    --gray-ink:#4A453B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:28px 20px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:20px;
    padding-bottom:18px;
    border-bottom:2px solid var(--ink);
  }
  h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:26px;
    font-weight:600;
    margin:0 0 4px;
    letter-spacing:-0.3px;
  }
  .subtitle{color:var(--ink-soft);font-size:13px;margin:0;}
  .stats{display:flex;gap:22px;}
  .stat{text-align:right;}
  .stat .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;display:block;line-height:1;}
  .stat .lab{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.5px;}
  .stat.flag .num{color:var(--rust-ink);}

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line-strong);}
  .tab-btn{
    background:none;border:none;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;
    color:var(--ink-soft);
    padding:9px 14px;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    cursor:pointer;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
  .toolbar-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:1;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border-radius:3px;}
  .btn-primary{background:var(--ink);color:var(--paper);border:none;padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:0.3px;}
  .btn-primary:hover{background:#000;}
  .btn-ghost{background:transparent;border:1px solid var(--line-strong);padding:9px 14px;font-size:12.5px;color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}
  .btn-ghost.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .btn-danger{background:transparent;border:1px solid var(--rust);color:var(--rust-ink);padding:9px 14px;font-size:12.5px;}
  .btn-danger:hover{background:var(--rust-bg);}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;text-decoration:underline;padding:2px;cursor:pointer;}
  .link-btn:hover{color:var(--rust-ink);}

  .search{padding:9px 12px;border:1px solid var(--line-strong);background:var(--card);font-size:13px;border-radius:3px;font-family:'Inter',sans-serif;color:var(--ink);min-width:170px;}
  select.sel{padding:9px 10px;border:1px solid var(--line-strong);background:var(--card);font-size:12.5px;border-radius:3px;font-family:'Inter',sans-serif;color:var(--ink);}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .board.with-archive{grid-template-columns:repeat(5,1fr);}
  @media (max-width:1000px){.board{grid-template-columns:1fr 1fr;}}
  @media (max-width:560px){.board{grid-template-columns:1fr;}}

  .col{background:rgba(255,255,255,0.35);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:120px;transition:border-color .12s,background .12s;}
  .col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;margin-bottom:8px;border-bottom:1px solid var(--line-strong);}
  .col-title{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;}
  .col-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .col-body{min-height:80px;}
  .col.drag-over{border-color:var(--ink);background:rgba(255,255,255,0.6);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 12px 10px;margin-bottom:10px;cursor:grab;position:relative;transition:border-color .12s,transform .12s,opacity .12s;}
  .card:hover{border-color:var(--ink);transform:translateY(-1px);}
  .card.dragging{opacity:0.4;}
  .card:active{cursor:grabbing;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;}
  .card .co{font-weight:600;font-size:14px;margin:0 0 2px;}
  .card .role{font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;}
  .card .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--gray-ink);flex-wrap:wrap;gap:4px;}
  .card .date{font-family:'IBM Plex Mono',monospace;}
  .edit-pencil{background:none;border:none;color:var(--ink-soft);font-size:12px;padding:2px 4px;cursor:pointer;line-height:1;opacity:0;transition:opacity .1s;}
  .card:hover .edit-pencil{opacity:1;}
  .edit-pencil:hover{color:var(--ink);}
  .followup-flag{display:inline-block;font-size:10px;font-weight:600;color:var(--rust-ink);background:var(--rust-bg);padding:2px 6px;border-radius:2px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.3px;text-transform:uppercase;margin-top:6px;}
  .card-edit-row{display:flex;gap:6px;margin-bottom:6px;}
  .card-edit-row input{flex:1;font-size:12.5px;padding:5px 7px;border:1px solid var(--line-strong);border-radius:3px;font-family:'Inter',sans-serif;}
  .card-edit-actions{display:flex;gap:6px;justify-content:flex-end;}
  .card-edit-actions button{font-size:11px;padding:4px 9px;}

  .badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:2px;letter-spacing:0.4px;text-transform:uppercase;}
  .b-applied{background:#E7E2D3;color:var(--gray-ink);}
  .b-interviewing{background:var(--slate-bg);color:var(--slate-ink);}
  .b-offer{background:var(--moss-bg);color:var(--moss-ink);}
  .b-rejected{background:var(--rust-bg);color:var(--rust-ink);}
  .b-archived{background:#E4E1D8;color:var(--gray-ink);}

  .empty-col{font-size:12px;color:var(--ink-soft);text-align:center;padding:18px 4px;font-style:italic;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state h3{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--ink);margin-bottom:6px;}

  /* Timeline */
  .timeline{position:relative;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line-strong);}
  .tl-item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:12px;cursor:pointer;}
  .tl-item:hover{border-color:var(--ink);}
  .tl-item::before{content:"";position:absolute;left:-22px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--paper);}
  .tl-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .tl-title{font-weight:600;font-size:14px;}
  .tl-role{font-size:12.5px;color:var(--ink-soft);}
  .tl-meta{display:flex;gap:8px;align-items:center;margin-top:6px;}

  /* Stats */
  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px;}
  .metric-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;}
  .metric-card .m-num{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;display:block;line-height:1.1;}
  .metric-card .m-lab{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .section-h{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 12px;}
  .funnel{margin-bottom:10px;}
  .funnel-row{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
  .funnel-bar-track{background:#E7E2D3;border-radius:3px;height:22px;overflow:hidden;}
  .funnel-bar-fill{background:var(--ink);height:100%;border-radius:3px;transition:width .3s;}
  .funnel-count{font-family:'IBM Plex Mono',monospace;text-align:right;color:var(--ink-soft);}

  /* Patterns */
  .pattern-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:700px){.pattern-cols{grid-template-columns:1fr;}}
  .pattern-list{display:flex;flex-direction:column;gap:8px;}
  .pattern-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 12px;}
  .pattern-bar-wrap{grid-column:1/-1;background:#E7E2D3;border-radius:2px;height:5px;margin-top:2px;overflow:hidden;}
  .pattern-bar{height:100%;border-radius:2px;}
  .pattern-bar.well{background:var(--moss);}
  .pattern-bar.wrong{background:var(--rust);}
  .pattern-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}

  /* Modal */
  .overlay{display:none;position:fixed;inset:0;background:rgba(30,26,20,0.45);z-index:50;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper);border:1px solid var(--ink);border-radius:6px;width:100%;max-width:580px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,0.18);}
  .modal h2{font-family:'IBM Plex Mono',monospace;font-size:18px;margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input, .field select, .field textarea{width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:3px;font-family:'Inter',sans-serif;font-size:13.5px;background:#fff;color:var(--ink);}
  .field textarea{resize:vertical;min-height:56px;font-family:'Inter',sans-serif;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:8px;align-items:center;}

  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .detail-head h2{margin:0;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:2px 6px;}
  .close-x:hover{color:var(--ink);}
  .detail-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .detail-meta a{color:var(--slate-ink);}

  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin:18px 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .add-log-btn{background:none;border:1px solid var(--line-strong);font-size:11px;padding:4px 8px;border-radius:3px;color:var(--ink);}
  .add-log-btn:hover{border-color:var(--ink);}

  .log-entry{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px;background:#fff;}
  .log-entry .log-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .log-entry .log-body{font-size:12.5px;line-height:1.5;}
  .log-entry .log-body b{color:var(--moss-ink);}
  .log-entry .log-body .bad{color:var(--rust-ink);}
  .log-entry .log-remove{background:none;border:none;color:var(--ink-soft);font-size:11px;cursor:pointer;padding:0;}
  .log-entry .log-remove:hover{color:var(--rust-ink);}
  .log-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .log-tag{font-size:10px;padding:2px 7px;border-radius:10px;font-family:'IBM Plex Mono',monospace;}
  .log-tag.well{background:var(--moss-bg);color:var(--moss-ink);}
  .log-tag.wrong{background:var(--rust-bg);color:var(--rust-ink);}
  .stars{color:var(--amber-ink);font-size:13px;letter-spacing:1px;}

  .new-log{border:1px dashed var(--line-strong);border-radius:4px;padding:10px 12px;margin-bottom:8px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .chip{font-size:11.5px;padding:5px 10px;border:1px solid var(--line-strong);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink-soft);}
  .chip:hover{border-color:var(--ink);}
  .chip.sel-well{background:var(--moss-bg);border-color:var(--moss);color:var(--moss-ink);}
  .chip.sel-wrong{background:var(--rust-bg);border-color:var(--rust);color:var(--rust-ink);}
  .star-pick{display:flex;gap:4px;font-size:22px;cursor:pointer;color:var(--line-strong);margin-bottom:10px;}
  .star-pick span.active{color:var(--amber-ink);}

  .save-note{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:6px;min-height:14px;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:-8px;margin-bottom:10px;}

  .research-links{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .rlink{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:3px 9px;border:1px solid var(--line-strong);border-radius:12px;color:var(--ink-soft);text-decoration:none;}
  .rlink:hover{border-color:var(--ink);color:var(--ink);}

  .week-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding:10px 4px 0;border-bottom:1px solid var(--line-strong);}
  .week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .week-bar-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);margin-bottom:3px;}
  .week-bar{width:100%;background:var(--ink);border-radius:2px 2px 0 0;min-height:2px;}
  .week-bar-label{font-size:9px;color:var(--ink-soft);margin-top:5px;white-space:nowrap;}

  #printSheet{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printSheet, #printSheet *{visibility:visible;}
    #printSheet{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;font-family:'Inter',sans-serif;color:#000;}
    #printSheet h1{font-family:'IBM Plex Mono',monospace;font-size:22px;margin:0 0 2px;}
    #printSheet h2{font-family:'IBM Plex Mono',monospace;font-size:14px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:0.5px;}
    #printSheet .ps-role{font-size:14px;color:#444;margin:0 0 4px;}
    #printSheet .ps-meta{font-size:12px;color:#555;margin:0 0 4px;}
    #printSheet .ps-log{border-bottom:1px solid #ccc;padding-bottom:10px;margin-bottom:12px;}
    #printSheet .ps-log-head{font-weight:600;margin-bottom:4px;}
    #printSheet .ps-tags{font-size:11px;color:#666;}
    #printSheet p{font-size:13px;line-height:1.5;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Job search ledger</h1>
      <p class="subtitle">Track applications, log interviews, note what worked. Press <b style="font-family:'IBM Plex Mono',monospace;font-weight:600;">N</b> to add, <b style="font-family:'IBM Plex Mono',monospace;font-weight:600;">/</b> to search.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-view="board">Board</button>
    <button class="tab-btn" data-view="timeline">Timeline</button>
    <button class="tab-btn" data-view="stats">Stats</button>
    <button class="tab-btn" data-view="patterns">Patterns</button>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <input class="search" id="search" placeholder="Search company or role...">
      <select class="sel" id="sortSel">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="company">Company A–Z</option>
        <option value="followup">Needs follow-up first</option>
      </select>
      <button class="btn-ghost" id="followupToggle">Needs follow-up</button>
      <button class="btn-ghost" id="archiveToggle">Show archived</button>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-ghost" id="exportBtn">Export backup</button>
      <button class="btn-ghost" id="importBtn">Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn-primary" id="addBtn">+ Log application</button>
    </div>
  </div>

  <div id="viewRoot"></div>
  <div class="save-note" id="saveNote"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>
<div id="printSheet"></div>

<script>
const STATUSES = ["Applied","Interviewing","Offer","Rejected"];
const ROUND_TYPES = ["Phone screen","Technical","Onsite","Final round","Behavioral","Recruiter call","Take-home","Other"];
const TAG_OPTIONS = ["Technical depth","Communication","Behavioral answers","Confidence","Culture fit","Salary negotiation","Preparation","Domain knowledge","Problem solving","Time management"];
const STORAGE_KEY = 'job-search-ledger-applications';

let apps = [];
let currentView = 'board';
let followUpOnly = false;
let showArchived = false;
let sortMode = 'newest';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(d1, d2){
  const a = new Date(d1+"T00:00:00"), b = new Date(d2+"T00:00:00");
  if(isNaN(a)||isNaN(b)) return null;
  return Math.round((b-a)/86400000);
}
function daysSince(d){ return daysBetween(d, todayStr()); }
function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function researchLinksHTML(company){
  const q = encodeURIComponent(company||'');
  if(!company) return '';
  return `
    <div class="research-links" onclick="event.stopPropagation()">
      <a href="https://www.glassdoor.com/Search/results.htm?keyword=${q}" target="_blank" rel="noopener" class="rlink">Glassdoor</a>
      <a href="https://www.linkedin.com/search/results/companies/?keywords=${q}" target="_blank" rel="noopener" class="rlink">LinkedIn</a>
      <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener" class="rlink">Search</a>
    </div>
  `;
}

function printPrepSheet(app){
  const sheet = document.getElementById('printSheet');
  const logs = (app.logs||[]).slice().sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  sheet.innerHTML = `
    <h1>${esc(app.company)}</h1>
    <p class="ps-role">${esc(app.role)}</p>
    <p class="ps-meta">Applied ${fmtDate(app.dateApplied)} &middot; Status: ${esc(app.status)}${app.link?` &middot; ${esc(app.link)}`:''}</p>
    ${app.resumeVersion || app.coverLetterNotes ? `<p class="ps-meta">${app.resumeVersion?('Resume: '+esc(app.resumeVersion)):''}${app.resumeVersion&&app.coverLetterNotes?' &middot; ':''}${app.coverLetterNotes?('Cover letter: '+esc(app.coverLetterNotes)):''}</p>` : ''}
    ${app.notes ? `<h2>Notes</h2><p>${esc(app.notes)}</p>` : ''}
    <h2>Interview history</h2>
    ${logs.length ? logs.map(l=>`
      <div class="ps-log">
        <p class="ps-log-head">${esc(l.round||'Interview')} &mdash; ${fmtDate(l.date)}${l.rating?(' &middot; '+l.rating+'/5'):''}</p>
        ${l.wentWell?`<p><strong>Went well:</strong> ${esc(l.wentWell)}</p>`:''}
        ${l.wentWrong?`<p><strong>To improve:</strong> ${esc(l.wentWrong)}</p>`:''}
        ${(l.wellTags||[]).concat(l.wrongTags||[]).length ? `<p class="ps-tags">Tags: ${[...(l.wellTags||[]),...(l.wrongTags||[])].map(esc).join(', ')}</p>` : ''}
      </div>
    `).join('') : '<p>No interviews logged yet.</p>'}
  `;
  window.print();
}

function weeklyBuckets(){
  const dated = apps.filter(a=>a.dateApplied).map(a=>a.dateApplied).sort();
  if(!dated.length) return [];
  const start = new Date(dated[0]+"T00:00:00");
  const day0 = (start.getDay()+6)%7;
  start.setDate(start.getDate()-day0);
  const end = new Date();
  const buckets = [];
  let cur = new Date(start);
  while(cur <= end){
    const wStart = new Date(cur);
    const wEnd = new Date(cur); wEnd.setDate(wEnd.getDate()+6);
    const count = apps.filter(a=>{
      if(!a.dateApplied) return false;
      const d = new Date(a.dateApplied+"T00:00:00");
      return d>=wStart && d<=wEnd;
    }).length;
    buckets.push({label: wStart.toLocaleDateString('en-US',{month:'short',day:'numeric'}), count});
    cur.setDate(cur.getDate()+7);
  }
  return buckets.slice(-10);
}

function lastActivityDate(app){
  if(app.logs && app.logs.length){
    return app.logs.reduce((max,l)=> (l.date && l.date>max) ? l.date : max, app.logs[0].date || app.dateApplied);
  }
  return app.dateApplied;
}
function needsFollowUp(app){
  if(app.archived) return false;
  if(app.status!=='Applied' && app.status!=='Interviewing') return false;
  const d = daysSince(lastActivityDate(app));
  return d !== null && d >= 7;
}

/* ---------- persistence ---------- */
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    apps = raw ? JSON.parse(raw) : [];
  }catch(e){ apps = []; }
  apps.forEach(a=>{
    if(a.archived===undefined) a.archived=false;
    if(!a.statusUpdatedAt) a.statusUpdatedAt = a.dateApplied;
    if(!a.logs) a.logs=[];
    a.logs.forEach(l=>{ if(!l.wellTags) l.wellTags=[]; if(!l.wrongTags) l.wrongTags=[]; if(l.rating===undefined) l.rating=0; });
  });
  render();
}
function saveData(){
  const note = document.getElementById('saveNote');
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(apps));
    note.textContent = "Saved to this browser";
    setTimeout(()=>{ if(note.textContent==="Saved to this browser") note.textContent=""; }, 1200);
  }catch(e){
    note.textContent = "Couldn't save — your browser may be blocking local storage.";
  }
}
function exportData(){
  const blob = new Blob([JSON.stringify(apps, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'job-applications-backup.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed)) throw new Error('bad format');
      apps = parsed;
      saveData(); render();
    }catch(e){
      alert("Couldn't read that file — make sure it's a backup exported from this tool.");
    }
  };
  reader.readAsText(file);
}

function setStatus(app, newStatus){
  if(app.status !== newStatus){
    app.status = newStatus;
    app.statusUpdatedAt = todayStr();
  }
}

/* ---------- header stats ---------- */
function renderHeaderStats(){
  const active = apps.filter(a=>!a.archived && (a.status==='Applied'||a.status==='Interviewing')).length;
  const offers = apps.filter(a=>!a.archived && a.status==='Offer').length;
  const flagged = apps.filter(needsFollowUp).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><span class="num">${apps.filter(a=>!a.archived).length}</span><span class="lab">Total</span></div>
    <div class="stat"><span class="num">${active}</span><span class="lab">Active</span></div>
    <div class="stat"><span class="num">${offers}</span><span class="lab">Offers</span></div>
    <div class="stat flag"><span class="num">${flagged}</span><span class="lab">Follow up</span></div>
  `;
}

/* ---------- filtering / sorting ---------- */
function getFiltered(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = apps.filter(a=>{
    if(!showArchived && a.archived) return false;
    if(showArchived && !a.archived) return true;
    if(q && !((a.company||"").toLowerCase().includes(q) || (a.role||"").toLowerCase().includes(q))) return false;
    if(followUpOnly && !needsFollowUp(a)) return false;
    return true;
  });
  return list;
}
function sortList(list){
  const arr = list.slice();
  if(sortMode==='newest') arr.sort((a,b)=> (b.dateApplied||"").localeCompare(a.dateApplied||""));
  else if(sortMode==='oldest') arr.sort((a,b)=> (a.dateApplied||"").localeCompare(b.dateApplied||""));
  else if(sortMode==='company') arr.sort((a,b)=> (a.company||"").localeCompare(b.company||""));
  else if(sortMode==='followup') arr.sort((a,b)=> (needsFollowUp(b)?1:0) - (needsFollowUp(a)?1:0) || (a.dateApplied||"").localeCompare(b.dateApplied||""));
  return arr;
}

/* ---------- main render dispatch ---------- */
function render(){
  renderHeaderStats();
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.view===currentView));
  document.getElementById('followupToggle').classList.toggle('on', followUpOnly);
  document.getElementById('archiveToggle').classList.toggle('on', showArchived);
  const root = document.getElementById('viewRoot');
  if(currentView==='board') root.innerHTML = boardHTML();
  else if(currentView==='timeline') root.innerHTML = timelineHTML();
  else if(currentView==='stats') root.innerHTML = statsHTML();
  else if(currentView==='patterns') root.innerHTML = patternsHTML();
  wireViewEvents();
}

/* ---------- STATS ---------- */
function statsHTML(){
  const all = apps;
  const total = all.length;
  if(total===0) return `<div class="empty-state"><h3>No data yet</h3><p>Stats will show up once you've logged applications.</p></div>`;
  const responded = all.filter(a=> a.status!=='Applied').length;
  const interviewed = all.filter(a=> (a.logs && a.logs.length>0) || a.status==='Interviewing' || a.status==='Offer').length;
  const offers = all.filter(a=> a.status==='Offer').length;
  const rejected = all.filter(a=> a.status==='Rejected');
  const offered = all.filter(a=> a.status==='Offer');
  const avgDaysOffer = offered.length ? Math.round(offered.reduce((s,a)=> s+(daysBetween(a.dateApplied, a.statusUpdatedAt)||0),0)/offered.length) : null;
  const avgDaysRejected = rejected.length ? Math.round(rejected.reduce((s,a)=> s+(daysBetween(a.dateApplied, a.statusUpdatedAt)||0),0)/rejected.length) : null;

  const pct = (n)=> total ? Math.round(n/total*100) : 0;
  const funnelMax = total;
  const funnel = [
    {label:'Applied', count: total},
    {label:'Interviewed', count: interviewed},
    {label:'Offer', count: offers}
  ];

  return `
    <div class="metric-grid">
      <div class="metric-card"><span class="m-num">${total}</span><span class="m-lab">Total applications</span></div>
      <div class="metric-card"><span class="m-num">${pct(responded)}%</span><span class="m-lab">Response rate</span></div>
      <div class="metric-card"><span class="m-num">${pct(interviewed)}%</span><span class="m-lab">Interview conversion</span></div>
      <div class="metric-card"><span class="m-num">${pct(offers)}%</span><span class="m-lab">Offer rate</span></div>
      <div class="metric-card"><span class="m-num">${avgDaysOffer===null?'—':avgDaysOffer+'d'}</span><span class="m-lab">Avg days to offer</span></div>
      <div class="metric-card"><span class="m-num">${avgDaysRejected===null?'—':avgDaysRejected+'d'}</span><span class="m-lab">Avg days to rejection</span></div>
    </div>
    <h3 class="section-h">Funnel</h3>
    <div class="funnel">
      ${funnel.map(f=>`
        <div class="funnel-row">
          <span>${f.label}</span>
          <div class="funnel-bar-track"><div class="funnel-bar-fill" style="width:${funnelMax? Math.round(f.count/funnelMax*100):0}%"></div></div>
          <span class="funnel-count">${f.count}</span>
        </div>
      `).join('')}
    </div>
    <h3 class="section-h">Applications per week</h3>
    ${weekChartHTML()}
  `;
}

function weekChartHTML(){
  const buckets = weeklyBuckets();
  if(!buckets.length) return `<p style="font-size:12.5px;color:var(--ink-soft);">Not enough data yet.</p>`;
  const max = Math.max(1, ...buckets.map(b=>b.count));
  return `
    <div class="week-chart">
      ${buckets.map(b=>`
        <div class="week-bar-col">
          <span class="week-bar-num">${b.count}</span>
          <div class="week-bar" style="height:${Math.max(2, Math.round(b.count/max*100))}%"></div>
          <span class="week-bar-label">${b.label}</span>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------- PATTERNS ---------- */
function patternsHTML(){
  const wellCounts = {}, wrongCounts = {};
  apps.forEach(a=> (a.logs||[]).forEach(l=>{
    (l.wellTags||[]).forEach(t=> wellCounts[t]=(wellCounts[t]||0)+1);
    (l.wrongTags||[]).forEach(t=> wrongCounts[t]=(wrongCounts[t]||0)+1);
  }));
  const wellArr = Object.entries(wellCounts).sort((a,b)=>b[1]-a[1]);
  const wrongArr = Object.entries(wrongCounts).sort((a,b)=>b[1]-a[1]);
  const maxCount = Math.max(1, ...wellArr.map(x=>x[1]), ...wrongArr.map(x=>x[1]));

  if(wellArr.length===0 && wrongArr.length===0){
    return `<div class="empty-state"><h3>No patterns yet</h3><p>Tag what went well or wrong when you log an interview, and recurring themes will show up here.</p></div>`;
  }
  const renderList = (arr, cls) => arr.length ? arr.map(([tag,count])=>`
    <div class="pattern-row">
      <span>${esc(tag)}</span>
      <span class="pattern-count">${count}&times;</span>
      <div class="pattern-bar-wrap"><div class="pattern-bar ${cls}" style="width:${Math.round(count/maxCount*100)}%"></div></div>
    </div>
  `).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);">Nothing tagged yet.</p>`;

  return `
    <div class="pattern-cols">
      <div>
        <h3 class="section-h">What's working</h3>
        <div class="pattern-list">${renderList(wellArr,'well')}</div>
      </div>
      <div>
        <h3 class="section-h">What to work on</h3>
        <div class="pattern-list">${renderList(wrongArr,'wrong')}</div>
      </div>
    </div>
  `;
}

/* ---------- wiring per-view events ---------- */
function wireViewEvents(){
  document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', (e)=>{ if(e.target.closest('.edit-pencil')) return; openDetail(card.dataset.id); });
    card.addEventListener('dragstart', (e)=>{
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>card.classList.add('dragging'),0);
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });
  document.querySelectorAll('.edit-pencil').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); startInlineEdit(btn.dataset.edit); });
  });
  document.querySelectorAll('.col-body').forEach(colBody=>{
    if(colBody.dataset.status==='Archived') return;
    colBody.addEventListener('dragover', (e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; colBody.closest('.col').classList.add('drag-over'); });
    colBody.addEventListener('dragleave', (e)=>{ if(!colBody.contains(e.relatedTarget)) colBody.closest('.col').classList.remove('drag-over'); });
    colBody.addEventListener('drop', (e)=>{
      e.preventDefault();
      colBody.closest('.col').classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const app = apps.find(a=>a.id===id);
      if(app){ setStatus(app, colBody.dataset.status); saveData(); render(); }
    });
  });
  document.querySelectorAll('.tl-item').forEach(item=>{
    item.addEventListener('click', ()=> openDetail(item.dataset.id));
  });
}

function startInlineEdit(id){
  const app = apps.find(a=>a.id===id);
  if(!app) return;
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(!card) return;
  card.innerHTML = `
    <div class="card-edit-row"><input id="ie-co" value="${esc(app.company)}"></div>
    <div class="card-edit-row"><input id="ie-role" value="${esc(app.role)}"></div>
    <div class="card-edit-actions">
      <button class="link-btn" id="ie-cancel">Cancel</button>
      <button class="btn-primary" id="ie-save" style="padding:5px 12px;">Save</button>
    </div>
  `;
  card.setAttribute('draggable','false');
  card.querySelector('#ie-cancel').onclick = (e)=>{ e.stopPropagation(); render(); };
  card.querySelector('#ie-save').onclick = (e)=>{
    e.stopPropagation();
    const co = card.querySelector('#ie-co').value.trim();
    const role = card.querySelector('#ie-role').value.trim();
    if(co) app.company = co;
    if(role) app.role = role;
    saveData();
    render();
  };
}

document.addEventListener('keydown', (e)=>{

  const typing = tag==='input' || tag==='textarea' || tag==='select';
  const modalOpen = document.getElementById('overlay').classList.contains('open');

    <div class="field"><label>General notes</label><textarea id="d-notes">${esc(app.notes)}</textarea></div>

    <div class="section-label"><span>Interview log</span><button class="add-log-btn" id="addLogBtn">+ Add entry</button></div>
    <div id="logsWrap">${logsHtml || '<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;">No interview rounds logged yet.</p>'}</div>
    <div id="newLogWrap"></div>

    <div class="modal-actions">
      <div>
        ${app.archived
          ? `<button class="btn-ghost" id="restoreBtn">Restore</button> <button class="btn-danger" id="deleteBtn" style="margin-left:6px;">Delete permanently</button>`
          : `<button class="btn-ghost" id="archiveBtn">Archive</button> <button class="link-btn" id="deleteBtn" style="margin-left:8px;">delete instead</button>`
        }
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" id="printBtn">Print prep sheet</button>
        <button class="btn-ghost" id="closeBtn">Close</button>
        <button class="btn-primary" id="updateBtn">Save changes</button>
      </div>
    </div>
  `;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('closeX').onclick = closeModal;
  document.getElementById('closeBtn').onclick = closeModal;
  document.getElementById('printBtn').onclick = ()=> printPrepSheet(app);

  document.getElementById('updateBtn').onclick = ()=>{
    setStatus(app, document.getElementById('d-status').value);
    app.dateApplied = document.getElementById('d-date').value || app.dateApplied;
    app.link = document.getElementById('d-link').value.trim();
    app.resumeVersion = document.getElementById('d-resume').value.trim();
    app.coverLetterNotes = document.getElementById('d-cover').value.trim();
    app.notes = document.getElementById('d-notes').value.trim();
    saveData(); render(); closeModal();
  };

  const delBtn = document.getElementById('deleteBtn');
  if(delBtn) delBtn.onclick = ()=>{
    if(confirm(`Permanently delete application to ${app.company}? This can't be undone.`)){
      apps = apps.filter(a=>a.id!==id);
      saveData(); render(); closeModal();
    }
  };
  const archBtn = document.getElementById('archiveBtn');
  if(archBtn) archBtn.onclick = ()=>{
    app.archived = true;
    saveData(); render(); closeModal();
  };
  const restoreBtn = document.getElementById('restoreBtn');
  if(restoreBtn) restoreBtn.onclick = ()=>{
    app.archived = false;
    saveData(); render(); closeModal();
  };

  document.getElementById('addLogBtn').onclick = ()=>{ renderNewLogForm(app, id); };
  modal.querySelectorAll('.log-remove').forEach(btn=>{
    btn.onclick = ()=>{
      app.logs = (app.logs||[]).filter(l=>l.id!==btn.dataset.logid);
      saveData(); openDetail(id);
    };
  });

  if(showNewLog) renderNewLogForm(app, id);
}

function renderNewLogForm(app, id){
  const wellSel = {arr:[]};
  const wrongSel = {arr:[]};
  let ratingVal = 0;
  const wrap = document.getElementById('newLogWrap');
  wrap.innerHTML = `
    <div class="new-log">
      <div class="row2">
        <div class="field"><label>Round</label><select id="log-round">${ROUND_TYPES.map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div>
        <div class="field"><label>Date</label><input id="log-date" type="date" value="${todayStr()}"></div>
      </div>
      <label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:600;">How did it feel</label>
      ${starPickerHTML('log-stars', 0)}
      <div class="field"><label>What went well</label><textarea id="log-well" placeholder="Answered the system design question confidently"></textarea></div>
      <div class="chip-row" id="well-chips">${chipRowHTML('well', [], 'well')}</div>
      <div class="field"><label>What went wrong / to improve</label><textarea id="log-wrong" placeholder="Rambled on the behavioral question, should've used STAR"></textarea></div>
      <div class="chip-row" id="wrong-chips">${chipRowHTML('wrong', [], 'wrong')}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn-ghost" id="cancelLogBtn">Cancel</button>
        <button class="btn-primary" id="saveLogBtn">Save entry</button>
      </div>
    </div>
  `;
  wireStarPicker('log-stars', (v)=>{ ratingVal = v; });
  wireChips(document.getElementById('well-chips'), wellSel, 'well');
  wireChips(document.getElementById('wrong-chips'), wrongSel, 'wrong');

  document.getElementById('cancelLogBtn').onclick = ()=>{ wrap.innerHTML=''; };
  document.getElementById('saveLogBtn').onclick = ()=>{
    const round = document.getElementById('log-round').value;
    const date = document.getElementById('log-date').value || todayStr();
    const well = document.getElementById('log-well').value.trim();
    const wrong = document.getElementById('log-wrong').value.trim();
    if(!well && !wrong && wellSel.arr.length===0 && wrongSel.arr.length===0){
      alert('Add a note or tag before saving.');
      return;
    }
    app.logs = app.logs || [];
    app.logs.push({id:uid(), round, date, wentWell:well, wentWrong:wrong, wellTags:wellSel.arr, wrongTags:wrongSel.arr, rating:ratingVal});
    saveData();
    openDetail(id);
  };
}

loadData();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
