<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Job Application Tracker</title>
<style>
:root{--paper:#f3eee1;--card:#fffdf8;--ink:#2a2620;--muted:#6b6455;--line:#c2b694;--red:#7a2e1e;--green:#2e4324;--blue:#22374d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif;padding:28px 20px 60px}.wrap{max-width:1180px;margin:auto}button,input,select,textarea{font:inherit}button{cursor:pointer}.auth-locked{overflow:hidden}
.auth-gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.auth-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 12px 30px #0001}.auth-card h1{font:600 24px monospace;margin:0 0 6px}.auth-card p{font-size:13px;color:var(--muted);line-height:1.5}.auth-card label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 6px}.auth-card input{width:100%;padding:11px;border:1px solid var(--line);border-radius:4px;background:#fff}.pin{letter-spacing:6px;font:600 20px monospace;text-align:center}.auth-primary,.primary{background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:11px 16px;font-weight:600}.auth-primary{width:100%;margin-top:16px}.secondary,.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 13px}.auth-link{background:none;border:0;color:var(--blue);text-decoration:underline;font-size:12px;width:100%;padding:10px}.auth-msg{min-height:20px;font-size:12px;line-height:1.4}.hidden{display:none!important}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:18px}.brand h1{font:600 26px monospace;margin:0 0 4px}.subtitle{font-size:13px;color:var(--muted);margin:0}.userbox{display:flex;align-items:center;gap:8px}.useremail{font-size:11px;color:var(--muted)}.stats{display:flex;gap:20px}.stat{text-align:right}.stat b{display:block;font:600 22px monospace}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{border:0;background:none;padding:9px 14px;font:600 12px monospace;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}.tab.active{color:var(--ink);border-bottom-color:var(--ink)}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search,select{padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}.search{min-width:210px}.ghost.on{background:var(--ink);color:var(--paper)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}@media(max-width:900px){.board{grid-template-columns:1fr 1fr}}@media(max-width:600px){.board{grid-template-columns:1fr}.stats{width:100%;justify-content:space-between}}
.col{border:1px solid var(--line);border-radius:6px;padding:10px;background:#fff5}.colhead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 4px 9px;margin-bottom:9px;font:600 12px monospace;text-transform:uppercase}.cards{min-height:100px}.card{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:9px}.card:hover{border-color:var(--ink)}.cardtop{display:flex;justify-content:space-between;gap:8px}.company{font-weight:600;font-size:14px}.role{font-size:12.5px;color:var(--muted);margin:3px 0 9px}.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}.badge{font:600 9px monospace;text-transform:uppercase;padding:3px 6px;border-radius:3px}.applied{background:#e7e2d3}.interviewing{background:#dce6ee;color:var(--blue)}.offer{background:#e1ead9;color:var(--green)}.rejected{background:#f1dad3;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:55px 20px}.empty h2{font:600 17px monospace;color:var(--ink)}
.modalback{position:fixed;inset:0;background:#1e1a1470;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}.modal{background:var(--paper);width:min(600px,100%);border:1px solid var(--ink);border-radius:6px;padding:24px}.modal h2{font:600 18px monospace;margin:0 0 18px}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff}.field textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row{grid-template-columns:1fr}}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.danger{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:4px;padding:9px 13px}.notice{font-size:11px;color:var(--muted);min-height:16px;text-align:center;margin-top:6px}
.listview{display:flex;flex-direction:column;gap:10px}.listrow{background:var(--card);border:1px solid var(--line);padding:13px;border-radius:5px;display:grid;grid-template-columns:1fr auto;gap:10px}.listrow h3{margin:0;font-size:14px}.listrow p{margin:4px 0;color:var(--muted);font-size:12px}.listactions{display:flex;gap:6px;align-items:start}.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.metric{background:var(--card);border:1px solid var(--line);padding:15px;border-radius:5px}.metric b{font:600 26px monospace;display:block}.metric span{font-size:11px;color:var(--muted)}
</style>
</head>
<body class="auth-locked">
<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <h1 id="authTitle">Sign in</h1>
    <p id="authSubtitle">Use your email and 6-digit PIN to access your job applications.</p>
    <form id="authForm">
      <label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <div id="pinBlock"><label>6-digit PIN</label><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="••••••"></div>
      <div id="newPinBlock" class="hidden"><label>New 6-digit PIN</label><input id="newPin" class="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"><label>Confirm PIN</label><input id="newPin2" class="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"></div>
      <button id="authSubmit" class="auth-primary" type="submit">Sign in</button>
      <button id="forgot" class="auth-link" type="button">Forgot PIN?</button>
      <button id="toggleAuth" class="secondary" type="button" style="width:100%">Create account</button>
      <div id="authMsg" class="auth-msg"></div>
    </form>
  </div>
</div>
<div id="app" class="hidden">
<div class="wrap">
<header><div class="brand"><h1>Job Application Tracker</h1><p class="subtitle">Cloud-synced job applications. Your data is private to your account.</p></div><div class="userbox"><span id="userEmail" class="useremail"></span><button id="logout" class="ghost">Log out</button></div><div id="stats" class="stats"></div></header>
<div class="tabs"><button class="tab active" data-view="board">Board</button><button class="tab" data-view="list">All applications</button><button class="tab" data-view="stats">Stats</button></div>
<div class="toolbar"><div class="toolbar-left"><input id="search" class="search" placeholder="Search company or role..."><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="company">Company A-Z</option></select><button id="add" class="primary">+ Log application</button></div><div class="toolbar-right"><button id="export" class="ghost">Export backup</button><button id="importBtn" class="ghost">Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></div></div>
<div id="root"></div><div id="notice" class="notice"></div>
</div></div>
<div id="modalBack" class="modalback hidden"><div class="modal" id="modal"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://jukzlfsrxwyqfmosqgin.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const STATUSES=['Applied','Interviewing','Offer','Rejected'];
let user=null,apps=[],view='board',authMode='signin',resetMode=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const validPin=p=>/^\d{6}$/.test(p||'');
function msg(t,ok=false){$('authMsg').textContent=t||'';$('authMsg').style.color=ok?'var(--green)':'var(--red)';}
function setAuth(mode){authMode=mode;resetMode=false;$('pinBlock').classList.remove('hidden');$('newPinBlock').classList.add('hidden');$('authTitle').textContent=mode==='signup'?'Create account':'Sign in';$('authSubtitle').textContent=mode==='signup'?'Create an account with your email and a 6-digit PIN.':'Use your email and 6-digit PIN to access your job applications.';$('authSubmit').textContent=mode==='signup'?'Create account':'Sign in';$('forgot').classList.toggle('hidden',mode==='signup');$('toggleAuth').textContent=mode==='signup'?'Back to sign in':'Create account';msg('');}
function setReset(){resetMode=true;authMode='reset';$('pinBlock').classList.add('hidden');$('newPinBlock').classList.remove('hidden');$('authTitle').textContent='Reset PIN';$('authSubtitle').textContent='Set a new 6-digit PIN.';$('authSubmit').textContent='Set new PIN';$('forgot').classList.add('hidden');$('toggleAuth').classList.add('hidden');msg('');}
function showApp(u){user=u;$('authGate').classList.add('hidden');$('app').classList.remove('hidden');document.body.classList.remove('auth-locked');$('userEmail').textContent=u.email||'';loadApps();}
function showAuth(){user=null;apps=[];$('app').classList.add('hidden');$('authGate').classList.remove('hidden');document.body.classList.add('auth-locked');$('toggleAuth').classList.remove('hidden');setAuth('signin');}
async function loadApps(){if(!user)return;const {data,error}=await supabase.from('job_applications').select('*').order('date_applied',{ascending:false});if(error){setNotice('Supabase error: '+error.message);apps=[];}else apps=data||[];render();}
function setNotice(t){$('notice').textContent=t;clearTimeout(setNotice.t);setNotice.t=setTimeout(()=>{$('notice').textContent=''},2200)}
function normalize(r){return {id:r.id,company:r.company||'',role:r.role||'',dateApplied:r.date_applied||today(),status:r.status||'Applied',link:r.link||'',resumeVersion:r.resume_version||'',coverLetterNotes:r.cover_letter_notes||'',notes:r.notes||'',archived:!!r.archived,logs:Array.isArray(r.logs)?r.logs:[]}}
function row(a){return {id:a.id,user_id:user.id,company:a.company,role:a.role,date_applied:a.dateApplied,status:a.status,status_updated_at:a.statusUpdatedAt||a.dateApplied,link:a.link||null,resume_version:a.resumeVersion||null,cover_letter_notes:a.coverLetterNotes||null,notes:a.notes||null,archived:!!a.archived,logs:a.logs||[]}}
async function save(a){const {data,error}=await supabase.from('job_applications').upsert(row(a)).select().single();if(error){alert(error.message);return false}Object.assign(a,normalize(data));setNotice('Saved to Supabase');return true}
async function remove(a){if(!confirm('Delete this application?'))return;const {error}=await supabase.from('job_applications').delete().eq('id',a.id);if(error)alert(error.message);else{apps=apps.filter(x=>x.id!==a.id);render();setNotice('Deleted')}}
function filtered(){const q=$('search').value.trim().toLowerCase();let x=apps.filter(a=>!a.archived&&(!q||a.company.toLowerCase().includes(q)||a.role.toLowerCase().includes(q)));const s=$('sort').value;if(s==='newest')x.sort((a,b)=>b.dateApplied.localeCompare(a.dateApplied));if(s==='oldest')x.sort((a,b)=>a.dateApplied.localeCompare(b.dateApplied));if(s==='company')x.sort((a,b)=>a.company.localeCompare(b.company));return x}
function badge(s){return `<span class="badge ${s.toLowerCase()}">${esc(s)}</span>`}
function renderStats(){const active=apps.filter(a=>a.status==='Applied'||a.status==='Interviewing').length,offers=apps.filter(a=>a.status==='Offer').length,rejected=apps.filter(a=>a.status==='Rejected').length;$('stats').innerHTML=`<div class="stat"><b>${apps.length}</b><span>Total</span></div><div class="stat"><b>${active}</b><span>Active</span></div><div class="stat"><b>${offers}</b><span>Offers</span></div><div class="stat"><b>${rejected}</b><span>Rejected</span></div>`}
function card(a){return `<div class="card"><div class="cardtop"><div><div class="company">${esc(a.company)}</div><div class="role">${esc(a.role)}</div></div>${badge(a.status)}</div><div class="meta"><span>${esc(a.dateApplied)}</span><span>${a.logs.length} interview${a.logs.length===1?'':'s'}</span></div><div style="display:flex;gap:6px;margin-top:10px"><button class="ghost edit" data-id="${a.id}">Edit</button><button class="danger del" data-id="${a.id}">Delete</button></div></div>`}
function board(){if(!apps.length)return `<div class="empty"><h2>No applications yet</h2><p>Click “Log application” to add your first job.</p></div>`;return `<div class="board">${STATUSES.map(s=>{const x=filtered().filter(a=>a.status===s);return `<div class="col"><div class="colhead"><span>${s}</span><span>${x.length}</span></div><div class="cards">${x.map(card).join('')||'<div class="empty">Nothing here</div>'}</div></div>`}).join('')}</div>`}
function listView(){const x=filtered();if(!x.length)return `<div class="empty"><h2>No applications found</h2><p>Try a different search.</p></div>`;return `<div class="listview">${x.map(a=>`<div class="listrow"><div><h3>${esc(a.company)} — ${esc(a.role)}</h3><p>${esc(a.dateApplied)} · ${badge(a.status)}</p><p>${esc(a.notes||'No notes')}</p></div><div class="listactions"><button class="ghost edit" data-id="${a.id}">Edit</button><button class="danger del" data-id="${a.id}">Delete</button></div></div>`).join('')}</div>`}
function statsView(){const total=apps.length,offers=apps.filter(a=>a.status==='Offer').length,int=apps.filter(a=>a.status==='Interviewing'||a.status==='Offer'||a.logs.length).length;return `<div class="metricgrid"><div class="metric"><b>${total}</b><span>Total applications</span></div><div class="metric"><b>${total?Math.round(int/total*100):0}%</b><span>Interview conversion</span></div><div class="metric"><b>${total?Math.round(offers/total*100):0}%</b><span>Offer rate</span></div><div class="metric"><b>${apps.filter(a=>a.status==='Rejected').length}</b><span>Rejected</span></div></div>`}
function render(){renderStats();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('root').innerHTML=view==='board'?board():view==='list'?listView():statsView();document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openModal(apps.find(a=>a.id===b.dataset.id)));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>remove(apps.find(a=>a.id===b.dataset.id)));}
function openModal(a=null){const x=a||{id:crypto.randomUUID(),company:'',role:'',dateApplied:today(),status:'Applied',link:'',resumeVersion:'',coverLetterNotes:'',notes:'',archived:false,logs:[]};$('modal').innerHTML=`<h2>${a?'Edit application':'Log application'}</h2><div class="row"><div class="field"><label>Company</label><input id="mCompany" value="${esc(x.company)}"></div><div class="field"><label>Role</label><input id="mRole" value="${esc(x.role)}"></div></div><div class="row"><div class="field"><label>Date applied</label><input id="mDate" type="date" value="${esc(x.dateApplied)}"></div><div class="field"><label>Status</label><select id="mStatus">${STATUSES.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Job URL</label><input id="mLink" type="url" value="${esc(x.link)}" placeholder="https://..."></div><div class="row"><div class="field"><label>Resume version</label><input id="mResume" value="${esc(x.resumeVersion)}"></div><div class="field"><label>Cover letter notes</label><input id="mCover" value="${esc(x.coverLetterNotes)}"></div></div><div class="field"><label>Notes</label><textarea id="mNotes">${esc(x.notes)}</textarea></div><div class="actions"><button id="cancel" class="ghost">Cancel</button><button id="save" class="primary">Save application</button></div>`;$('modalBack').classList.remove('hidden');$('cancel').onclick=closeModal;$('save').onclick=async()=>{x.company=$('mCompany').value.trim();x.role=$('mRole').value.trim();x.dateApplied=$('mDate').value||today();x.status=$('mStatus').value;x.link=$('mLink').value.trim();x.resumeVersion=$('mResume').value.trim();x.coverLetterNotes=$('mCover').value.trim();x.notes=$('mNotes').value.trim();if(!x.company||!x.role){alert('Company and role are required.');return}const ok=await save(x);if(ok){if(!a)apps.unshift(x);render();closeModal()}}}
function closeModal(){$('modalBack').classList.add('hidden')}
$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};$('add').onclick=()=>openModal();$('search').oninput=render;$('sort').onchange=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('logout').onclick=async()=>{await supabase.auth.signOut();showAuth()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(apps,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='job-applications-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw new Error('Invalid backup');for(const a of data){a.id=crypto.randomUUID();await save(a)}await loadApps();setNotice('Backup imported')}catch(err){alert(err.message)}e.target.value=''};
$('toggleAuth').onclick=()=>{if(resetMode){$('toggleAuth').classList.remove('hidden');setAuth('signin')}else setAuth(authMode==='signin'?'signup':'signin')};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){msg('Enter your email first.');return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)msg(error.message);else msg('Reset email sent. Open it to choose a new 6-digit PIN.',true)};
$('authForm').onsubmit=async e=>{e.preventDefault();msg('');const email=$('email').value.trim();if(resetMode){const p=$('newPin').value,p2=$('newPin2').value;if(!validPin(p)||p!==p2){msg('PIN must be exactly 6 digits and both entries must match.');return}const {error}=await supabase.auth.updateUser({password:p});if(error){msg(error.message);return}msg('PIN updated. Sign in with your new PIN.',true);await supabase.auth.signOut();setAuth('signin');return}const pin=$('pin').value;if(!validPin(pin)){msg('PIN must be exactly 6 digits.');return}$('authSubmit').disabled=true;try{if(authMode==='signup'){const {data,error}=await supabase.auth.signUp({email,password:pin});if(error)throw error;if(data.session)showApp(data.user);else msg('Account created. Check your email if confirmation is enabled, then sign in.',true)}else{const {data,error}=await supabase.auth.signInWithPassword({email,password:pin});if(error)throw error;showApp(data.user)}}catch(err){msg(err.message||'Authentication failed.')}finally{$('authSubmit').disabled=false}};
supabase.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')setTimeout(setReset,0);else if(session&&!resetMode)setTimeout(()=>showApp(session.user),0);else if(!session&&!resetMode)setTimeout(showAuth,0)});
(async()=>{if(SUPABASE_PUBLISHABLE_KEY==='YOUR_SUPABASE_PUBLISHABLE_KEY'){msg('Add your Supabase Publishable Key in index.html before testing.');return}const {data,error}=await supabase.auth.getSession();if(error){msg(error.message);return}if(data.session)showApp(data.session.user);else showAuth()})();
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{})}
</script>
</body>
</html>
